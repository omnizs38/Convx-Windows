name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compile
        run: gradle --no-daemon build -x test

      - name: Portable distributable
        run: gradle --no-daemon createDistributable

      - name: Installers (MSI + EXE)
        run: gradle --no-daemon packageMsi packageExe

      - name: Zip portable build
        shell: pwsh
        run: |
          $src = Get-ChildItem build/compose/binaries/main/app -Directory | Select-Object -First 1
          Compress-Archive -Path "$($src.FullName)/*" -DestinationPath build/Convx-windows-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: convx-windows
          path: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
            build/Convx-windows-portable.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
            build/Convx-windows-portable.zip
